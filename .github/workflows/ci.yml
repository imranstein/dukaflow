name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format and analyse
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: composer run test:lint

      - name: Static analysis
        run: composer run test:types

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the rep PWA's frontend
        run: npm run build

  docker-build:
    # Proves docker/Dockerfile actually produces an image, not just that it
    # reads plausibly. Added after a review caught a platform-check failure
    # (filament/support needs ext-intl, composer:2's image doesn't ship it)
    # that a local build never got far enough to hit, and a fix for it that
    # a disk-constrained local machine couldn't fully re-verify either — a
    # runner with real disk space closes that gap permanently instead of
    # relying on it having been checked by hand once.
    name: Build the production image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -f docker/Dockerfile -t dukaflow:ci .

  tests:
    # SQLite is what the suite runs on day to day because it is instant, but
    # MySQL is the production target and enforces things SQLite does not:
    # column lengths, decimal scale, strict mode, real transaction semantics.
    # The stock ledger's invariants live in exactly that territory.
    name: Tests on ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: dukaflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, intl, bcmath
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the rep PWA's frontend
        run: npm run build

      - name: Tests
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.database == 'mysql' && 'dukaflow_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: password
        run: composer run test:suite
